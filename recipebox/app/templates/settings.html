{% extends "base.html" %}
{% block title %}{{ t('settings') }} · RecipeBox{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ t('settings') }}</h1></div>

{% if saved %}<div class="flash">✓ {{ t('settings_saved') }}</div>{% endif %}

<form method="post" action="{{ base }}/settings" style="max-width:480px;margin-top:18px">
  <div class="field">
    <label>{{ t('language') }}</label>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
      {% for code, info in languages.items() %}
      <label class="row" style="gap:12px;background:var(--card);border:1.5px solid {{ 'var(--accent)' if code==lang else 'var(--line)' }};
        border-radius:12px;padding:12px 16px;cursor:pointer" {% if info.dir=='rtl' %}dir="rtl"{% endif %}>
        <input type="radio" name="language" value="{{ code }}" {% if code==lang %}checked{% endif %}>
        <span style="font-weight:500">{{ info.name }}</span>
      </label>
      {% endfor %}
    </div>
  </div>
  <button class="btn" type="submit">{{ t('save') }}</button>
</form>
{% endblock %}
