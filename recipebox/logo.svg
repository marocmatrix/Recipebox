<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9682a"/>
      <stop offset="1" stop-color="#9c3f12"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f4ead9"/>
    </linearGradient>
  </defs>

  <!-- icon mark -->
  <g transform="translate(12 16)">
    <rect width="128" height="128" rx="30" fill="url(#bg)"/>
    <circle cx="40" cy="32" r="60" fill="#ffffff" opacity="0.06"/>
    <g transform="translate(26 28)">
      <rect x="3" y="4" width="70" height="76" rx="8" fill="#3d2510" opacity="0.25"/>
      <rect x="0" y="0" width="70" height="76" rx="8" fill="url(#page)"/>
      <rect x="0" y="0" width="9" height="76" rx="4.5" fill="#e8a830"/>
      <g fill="#d8c7ad">
        <rect x="20" y="16" width="38" height="5" rx="2.5"/>
        <rect x="20" y="28" width="31" height="4" rx="2"/>
        <rect x="20" y="38" width="36" height="4" rx="2"/>
        <rect x="20" y="48" width="27" height="4" rx="2"/>
      </g>
      <rect x="20" y="7" width="20" height="5" rx="2.5" fill="#d9682a"/>
    </g>
    <g transform="translate(74 78) rotate(20)" stroke="#fffdfa" stroke-width="4.5" stroke-linecap="round" fill="none">
      <line x1="0" y1="8" x2="0" y2="34"/>
      <ellipse cx="0" cy="1" rx="6" ry="9" fill="#fffdfa" stroke="none"/>
    </g>
    <g transform="translate(90 78) rotate(-18)" stroke="#fffdfa" stroke-width="4.5" stroke-linecap="round">
      <line x1="0" y1="9" x2="0" y2="34"/>
      <line x1="-5" y1="-3" x2="-5" y2="10"/>
      <line x1="0" y1="-4" x2="0" y2="10"/>
      <line x1="5" y1="-3" x2="5" y2="10"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(168 0)">
    <text x="0" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#2b2622">Recipe<tspan fill="#d9682a">Box</tspan></text>
    <text x="2" y="106" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3" fill="#8a7f74">SELF-HOSTED COOKBOOK</text>
  </g>
