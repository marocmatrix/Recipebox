<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9682a"/>
      <stop offset="1" stop-color="#9c3f12"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f4ead9"/>
    </linearGradient>
  </defs>

  <!-- rounded tile background -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- subtle warm highlight -->
  <circle cx="80" cy="64" r="120" fill="#ffffff" opacity="0.06"/>

  <!-- recipe book / card -->
  <g transform="translate(52 56)">
    <!-- back cover shadow -->
    <rect x="6" y="8" width="140" height="150" rx="14" fill="#3d2510" opacity="0.25"/>
    <!-- page -->
    <rect x="0" y="0" width="140" height="150" rx="14" fill="url(#page)"/>
    <!-- spine -->
    <rect x="0" y="0" width="16" height="150" rx="8" fill="#e8a830"/>

    <!-- recipe lines -->
    <g fill="#d8c7ad">
      <rect x="36" y="30" width="78" height="9" rx="4.5"/>
      <rect x="36" y="52" width="64" height="7" rx="3.5"/>
      <rect x="36" y="70" width="74" height="7" rx="3.5"/>
      <rect x="36" y="88" width="56" height="7" rx="3.5"/>
    </g>
    <!-- title accent -->
    <rect x="36" y="14" width="40" height="8" rx="4" fill="#d9682a"/>
  </g>

  <!-- fork & spoon crossed, bottom-right -->
  <g transform="translate(150 150) rotate(20)" stroke="#fffdfa" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- spoon -->
    <line x1="0" y1="14" x2="0" y2="64"/>
    <ellipse cx="0" cy="2" rx="11" ry="16" fill="#fffdfa" stroke="none"/>
  </g>
  <g transform="translate(176 150) rotate(-18)" stroke="#fffdfa" stroke-width="7" stroke-linecap="round">
    <!-- fork -->
    <line x1="0" y1="16" x2="0" y2="64"/>
    <line x1="-9" y1="-6" x2="-9" y2="18"/>
    <line x1="0" y1="-8" x2="0" y2="18"/>
    <line x1="9" y1="-6" x2="9" y2="18"/>
  </g>
</svg>
